name: planner

services:
  php-fpm:
    container_name: planner-php-fpm
    image: planner-app:latest
    build:
      context: ..
      dockerfile: ./docker/production/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
    volumes:
      - storage:/var/www/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started: any mail sent right after boot (first request, seeded flow)
      # must reach the SMTP listener instead of racing it.
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  queue:
    container_name: planner-queue
    # Same image as php-fpm (built once as planner-app:latest; no separate build).
    image: planner-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      # php-fpm migrates + seeds on its own boot (queue waits for its healthcheck);
      # SKIP_MIGRATE keeps the worker from re-running it on every start.
      SKIP_MIGRATE: "1"
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    volumes:
      - storage:/var/www/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network
    depends_on:
      php-fpm:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    container_name: planner-nginx
    image: planner-nginx:latest
    build:
      context: ..
      dockerfile: ./docker/production/Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  mariadb:
    container_name: planner-mariadb
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - database:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "mariadb", "-uroot", "-p${MARIADB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: planner-redis
    image: redis:8.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    container_name: planner-mailpit
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network

networks:
  network:

volumes:
  database:
  storage:
  redis:
